<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; display: flex; justify-content: center; background-color: #222; font-family: sans-serif; }
        #oyun-alani { width: 600px; height: 500px; background-color: #3498db; position: relative; border: 4px solid white; border-radius: 15px; overflow: hidden; cursor: crosshair; }
        #karakter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); max-height: 80%; transition: transform 0.1s; }
        .skor { position: absolute; top: 10px; right: 20px; color: white; font-size: 20px; font-weight: bold; }
        .efekt { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.6); border: 4px solid gold; border-radius: 50%; pointer-events: none; animation: patla 0.3s forwards; }
        @keyframes patla { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    </style>
</head>
<body>
    <div id="oyun-alani">
        <div class="skor">Vuruş: <span id="skor-sayi">0</span></div>
        <img id="karakter" src=""> </div>

    <script>
        const karakter = document.getElementById('karakter');
        const skorYazi = document.getElementById('skor-sayi');
        let skor = 0;

        karakter.addEventListener('mousedown', (e) => {
            skor++;
            skorYazi.innerText = skor;
            
            // Sarsılma
            karakter.style.transform = "translateX(-50%) scale(0.9) rotate(5deg)";
            setTimeout(() => { karakter.style.transform = "translateX(-50%) scale(1) rotate(0deg)"; }, 100);

            // Efekt
            const rect = document.getElementById('oyun-alani').getBoundingClientRect();
            const efekt = document.createElement('div');
            efekt.className = 'efekt';
            efekt.style.left = (e.clientX - rect.left - 30) + 'px';
            efekt.style.top = (e.clientY - rect.top - 30) + 'px';
            document.getElementById('oyun-alani').appendChild(efekt);
            setTimeout(() => efekt.remove(), 300);
        });
    </script>
</body>
</html>
